services:
  visiomilhas_app:
    image: datavisio/visiomilhas:${VISIOMILIAS_IMAGE_TAG}
    container_name: ${VISIOMILIAS_CONTAINER_NAME:-visiomilhas_app}
    command: ["node", "server.js"]
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.${VISIOMILIAS_ROUTER_NAME}.rule=Host(`${VISIOMILIAS_PUBLIC_HOST}`)"
      - "traefik.http.routers.${VISIOMILIAS_ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${VISIOMILIAS_ROUTER_NAME}.tls=true"
      - "traefik.http.routers.${VISIOMILIAS_ROUTER_NAME}.tls.certresolver=le"
      - "traefik.http.routers.${VISIOMILIAS_ROUTER_NAME}.service=${VISIOMILIAS_SERVICE_NAME}"
      - "traefik.http.services.${VISIOMILIAS_SERVICE_NAME}.loadbalancer.server.port=3000"

networks:
  traefik_public:
    external: true
