      - id: security-discovery
        file: .github/agents/security-discovery.agent.md
        produces:
          - security-assessment.yaml
        depends_on:
          - project-discovery
        status: ready
      - id: infrastructure-discovery
        file: .github/agents/infrastructure-discovery.agent.md
        produces:
