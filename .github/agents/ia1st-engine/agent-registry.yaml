bootstrap:
  name: IA-1st Engine Registry
  version: 1.0.0
  generated_at: 2026-05-31
  canonical_root: .github/agents/ia1st-engine
  scan_scope:
    - .github/agents/*.agent.md
    - .ai-first/**/*.agent.md
  task_intake:
    enabled: true
    gate: execution_graph_and_dependency_validation

dependency_validation:
  acyclic: true
  validated_domain_order:
    - discovery
    - planning
    - implementation
    - validation
    - operations
    - governance
  unresolved_items:
    - artifact_registry.yaml
    - governance_policy.yaml
    - release_policy.yaml
    - autopilot_policy.yaml
    - prompt-routing-protocol.yaml

orchestrators:
  - id: ia1st-orchestrator
    name: IA-1st Orchestrator
    file: .github/agents/ia1st-orchestrator.agent.md
    domain: orchestrator
    role: bootstrap and route work
    consumes:
      - environment-context.md
      - technical-inventory.yaml
      - dependency-map.yaml
      - business-capabilities.yaml
      - business-rules-catalog.yaml
      - ui-inventory.yaml
      - as-is-architecture.yaml
      - domain-model.yaml
      - integration-landscape.yaml
      - security-assessment.yaml
      - infrastructure-landscape.yaml
      - technical-debt-report.yaml
      - code-quality-report.yaml
      - test-coverage-report.yaml
      - complexity-report.yaml
      - modernization-priority-matrix.yaml
      - as-is-system-model.md
    produces:
      - execution-plan.md
    status: ready

  - id: ia-1st-orchestrator
    name: IA-1st Orchestrator
    file: .github/agents/ia-1st-orchestrator.agent.md
    domain: orchestrator
    role: canonical orchestrator definition
    consumes:
      - environment-context.md
      - technical-inventory.yaml
      - dependency-map.yaml
      - business-capabilities.yaml
      - business-rules-catalog.yaml
      - ui-inventory.yaml
      - as-is-architecture.yaml
      - domain-model.yaml
      - integration-landscape.yaml
      - security-assessment.yaml
      - infrastructure-landscape.yaml
      - technical-debt-report.yaml
      - code-quality-report.yaml
      - test-coverage-report.yaml
      - complexity-report.yaml
      - modernization-priority-matrix.yaml
      - as-is-system-model.md
    produces:
      - execution-plan.md
    status: ready

