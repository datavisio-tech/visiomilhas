      - project-discovery
      - business-discovery
      - ui-discovery
      - architecture-discovery
      - data-model-discovery
      - integration-discovery
      - legacy-knowledge-discovery
      - security-discovery
      - infrastructure-discovery
      - quality-discovery
    agents:
      - id: environment-discovery
        file: .github/agents/environment-discovery.agent.md
        produces:
          - environment-context.md
        depends_on: []
        status: ready
      - id: project-discovery
        file: .github/agents/project-discovery.agent.md
        produces:
          - technical-inventory.yaml
          - dependency-map.yaml
          - business-capabilities.yaml
          - modernization-candidates.yaml
          - as-is-system-model.md
        depends_on:
          - environment-discovery
        status: ready
      - id: business-discovery
        file: .github/agents/business-discovery.agent.md
        produces:
          - business-rules-catalog.yaml
          - business-capabilities.yaml
        depends_on:
          - project-discovery
        status: ready
      - id: ui-discovery
        file: .github/agents/ui-discovery.agent.md
        produces:
          - ui-inventory.yaml
          - navigation-map.yaml
        depends_on:
          - project-discovery
        status: ready
      - id: architecture-discovery
        file: .github/agents/architecture-discovery.agent.md
