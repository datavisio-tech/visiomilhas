name: Production Deploy Manual - VisioMilhas
# workflow_dispatch refresh marker

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Digite DEPLOY para confirmar o deploy em produção"
        required: true
        type: string
      image_tag:
        description: "Tag da imagem Docker a ser usada no deploy"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production Swarm
    runs-on: ubuntu-latest
    environment: production

    env:
      REMOTE_DIR: ${{ secrets.REMOTE_APP_DIR }}
      IMAGE_NAME: datavisio/visiomilhas
      STACK_NAME: visiomilhas
      SERVICE_NAME: visiomilhas_visiomilhas_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public production config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f config/production-public.env ]; then
            echo "Missing config/production-public.env"
            exit 1
          fi
          cat config/production-public.env >> "$GITHUB_ENV"

      - name: Validate production deploy confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_production_deploy }}" != "DEPLOY" ]; then
            echo "Production deploy not confirmed. Type DEPLOY to continue."
            exit 1
          fi
          echo "Production deploy confirmation accepted."

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            REMOTE_DIR
            SSH_HOST
            SSH_PORT
            SSH_USER
            SSH_PRIVATE_KEY
            APP_NAME
            APP_URL
            NEXT_PUBLIC_APP_URL
            NODE_ENV
            USE_FIFO_MOVEMENTS_ENGINE
            PLANO
            PLANO_ANUAL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            POSTGRES_HOST
            POSTGRES_PORT
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_DB
            SAAS_DB
            APP_DB
            MONGODB_SERVER_IP
            MONGODB_USER
            MONGODB_USER_PASSWORD
            MONGODB_DATABASE
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/env: ${name}"
              exit 1
            fi
          done

          echo "Required production secrets are present."
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST || secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || secrets.POSTGRES_DB }}
          SAAS_DB: ${{ vars.SAAS_DB || secrets.SAAS_DB }}
          APP_DB: ${{ vars.APP_DB || secrets.APP_DB }}
          MONGODB_SERVER_IP: ${{ vars.MONGODB_SERVER_IP || secrets.MONGODB_SERVER_IP }}
          MONGODB_USER: ${{ secrets.MONGODB_USER }}
          MONGODB_USER_PASSWORD: ${{ secrets.MONGODB_USER_PASSWORD }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || secrets.MONGODB_DATABASE }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/visiomilhas_deploy_key
          chmod 600 ~/.ssh/visiomilhas_deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/visiomilhas_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${REMOTE_DIR}' && test -w '${REMOTE_DIR}'"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Sync source to server
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.claude' \
            --exclude 'dumps' \
            --exclude 'backups' \
            --exclude 'coverage' \
            --exclude 'logs' \
            --exclude '*.log' \
            --exclude '*.tmp' \
            --exclude '*.cache' \
            --exclude '*.sqlite' \
            --exclude '*.sqlite3' \
            --exclude '*.dump' \
            --exclude '*.bak' \
            --exclude '*.backup' \
            --exclude '*.zip' \
            --exclude '*.tar' \
            --exclude '*.tgz' \
            --exclude '*.gz' \
            -e "ssh -i ~/.ssh/visiomilhas_deploy_key -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Render production env on server
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "${env_file}"' EXIT

          existing_auth_secret="$(
            ssh -i ~/.ssh/visiomilhas_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
              "if [ -f '${REMOTE_DIR}/.env.production' ]; then grep -E '^(AUTH_SECRET|BETTER_AUTH_SECRET)=' '${REMOTE_DIR}/.env.production' | tail -n 1; fi" \
            || true
          )"
          if [ -n "${existing_auth_secret}" ]; then
            printf '%s\n' "${existing_auth_secret}" > "${env_file}"
          fi

          printf '%s\n' \
            "APP_NAME=${APP_NAME}" \
            "APP_URL=${APP_URL}" \
            "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}" \
            "NODE_ENV=${NODE_ENV}" \
            "USE_FIFO_MOVEMENTS_ENGINE=${USE_FIFO_MOVEMENTS_ENGINE}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
            "POSTGRES_HOST=${POSTGRES_HOST}" \
            "POSTGRES_PORT=${POSTGRES_PORT}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "SAAS_DB=${SAAS_DB}" \
            "APP_DB=${APP_DB}" \
            "DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" \
            "ADM_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${SAAS_DB}" \
            "APP_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${APP_DB}" \
            "MONGODB_SERVER_IP=${MONGODB_SERVER_IP}" \
            "MONGODB_USER=${MONGODB_USER}" \
            "MONGODB_USER_PASSWORD=${MONGODB_USER_PASSWORD}" \
            "MONGODB_DATABASE=${MONGODB_DATABASE}" \
            "MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_USER_PASSWORD}@${MONGODB_SERVER_IP}/${MONGODB_DATABASE}" > "${env_file}"

          chmod 600 "${env_file}"
          scp -i ~/.ssh/visiomilhas_deploy_key -P "${SSH_PORT}" "${env_file}" "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/.env.production.tmp"
          ssh -i ~/.ssh/visiomilhas_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "cd '${REMOTE_DIR}' && mv .env.production.tmp .env.production && chmod 600 .env.production && test -s .env.production"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST || secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || secrets.POSTGRES_DB }}
          SAAS_DB: ${{ vars.SAAS_DB || secrets.SAAS_DB }}
          APP_DB: ${{ vars.APP_DB || secrets.APP_DB }}
          MONGODB_SERVER_IP: ${{ vars.MONGODB_SERVER_IP || secrets.MONGODB_SERVER_IP }}
          MONGODB_USER: ${{ secrets.MONGODB_USER }}
          MONGODB_USER_PASSWORD: ${{ secrets.MONGODB_USER_PASSWORD }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || secrets.MONGODB_DATABASE }}

      - name: Build image and deploy stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/visiomilhas_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "cd '${REMOTE_DIR}' && docker build -t '${IMAGE_NAME}:${GITHUB_SHA}' . && VISIOMILHAS_IMAGE_TAG='${GITHUB_SHA}' docker stack deploy -c stack.visiomilhas.yml '${STACK_NAME}'"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Validate deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/visiomilhas_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "docker stack services '${STACK_NAME}' && docker service ps '${SERVICE_NAME}' --no-trunc"
          curl -fsS --retry 5 --retry-delay 5 "${APP_URL}/" > /dev/null
          echo "Production smoke test passed for ${IMAGE_NAME}:${GITHUB_SHA}."
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
