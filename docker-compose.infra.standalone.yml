services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_public"
      traefik.http.routers.portainer.rule: "Host(`portainer.visiochat.cloud`)"
      traefik.http.routers.portainer.entrypoints: "websecure"
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: "le"
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
      traefik.http.services.portainer.loadbalancer.passHostHeader: "true"

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: postgres_db
    command: ["postgres", "--max_connections=200"]
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    networks:
      - traefik_public
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_public"
      traefik.http.routers.pgadmin.rule: "Host(`pgadmin.visiochat.cloud`)"
      traefik.http.routers.pgadmin.entrypoints: "websecure"
      traefik.http.routers.pgadmin.tls: "true"
      traefik.http.routers.pgadmin.tls.certresolver: "le"
      traefik.http.services.pgadmin.loadbalancer.server.port: "80"
      traefik.http.services.pgadmin.loadbalancer.passHostHeader: "true"

  redis:
    image: redis:latest
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    restart: unless-stopped
    networks:
      - traefik_public
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    networks:
      - traefik_public
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_public"
      traefik.http.routers.redis-commander.rule: "Host(`redis.visiochat.cloud`)"
      traefik.http.routers.redis-commander.entrypoints: "websecure"
      traefik.http.routers.redis-commander.tls: "true"
      traefik.http.routers.redis-commander.tls.certresolver: "le"
      traefik.http.services.redis-commander.loadbalancer.server.port: "8081"
      traefik.http.services.redis-commander.loadbalancer.passHostHeader: "true"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_USER_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_configdb_data:/data/configdb

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - traefik_public
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    volumes:
      - minio_data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_public"
      traefik.http.routers.minio_s3.rule: "Host(`minioback.visiochat.cloud`)"
      traefik.http.routers.minio_s3.entrypoints: "websecure"
      traefik.http.routers.minio_s3.tls: "true"
      traefik.http.routers.minio_s3.tls.certresolver: "le"
      traefik.http.routers.minio_s3.service: "minio_s3"
      traefik.http.services.minio_s3.loadbalancer.server.port: "9000"
      traefik.http.routers.minio_console.rule: "Host(`minioapp.visiochat.cloud`)"
      traefik.http.routers.minio_console.entrypoints: "websecure"
      traefik.http.routers.minio_console.tls: "true"
      traefik.http.routers.minio_console.tls.certresolver: "le"
      traefik.http.routers.minio_console.service: "minio_console"
      traefik.http.services.minio_console.loadbalancer.server.port: "9001"

networks:
  traefik_public:
    external: true

volumes:
  portainer_data:
    external: true
  postgres_data:
    external: true
    name: 3_postgres_postgres_data
  pgadmin_data:
    external: true
  redis_data:
    external: true
  mongodb_data:
    external: true
  mongodb_configdb_data:
    external: true
  minio_data:
    external: true
